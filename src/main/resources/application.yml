server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: app_core
  jackson:
    date-format: dd/MM/yyyy
    deserialization:
      fail-on-unknown-properties: false
  data:
    web:
      pageable:
        default-page-size: ${SPRING_DATA_WEB_PAGEABLE_DEFAULT_PAGE_SIZE:20}
        max-page-size: ${SPRING_DATA_WEB_PAGEABLE_MAX_PAGE_SIZE:100}
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crud_db}
    username: ${SPRING_DATASOURCE_USERNAME:crud}
    password: ${SPRING_DATASOURCE_PASSWORD:crud}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
    change-log: classpath:liquibase/master.xml

application:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:9000}
  security:
    jwt-base64-secret: ${APP_SECURITY_JWT_BASE64_SECRET:}
    issuer: ${APP_SECURITY_JWT_ISSUER:app_core}
    audience: ${APP_SECURITY_JWT_AUDIENCE:app_core}
    token-validity-seconds: ${APP_SECURITY_TOKEN_VALIDITY_SECONDS:86400}
