spring:
  application:
    name: rh-reference-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: false
  jackson:
    default-property-inclusion: non-null
  web:
    error:
      include-message: never

app:
  security:
    jwt:
      secret-base64: ${APP_SECURITY_JWT_SECRET_BASE64:}
      issuer: ${APP_SECURITY_JWT_ISSUER:crud-reference}
      ttl: ${APP_SECURITY_JWT_TTL:PT1H}
    cors:
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:9000}
